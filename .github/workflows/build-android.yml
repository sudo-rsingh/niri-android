name: Build Android

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type (debug or release)
        required: false
        default: release
        type: choice
        options: [debug, release]
      sign:
        description: Sign APK and publish a GitHub release (requires keystore secrets)
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'release' }} APK
    runs-on: ubuntu-latest

    env:
      # User-writable path avoids tar permission errors when restoring the cache.
      # Both vars must point to the same place — Gradle errors if they differ.
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Keyed on app/build.gradle.kts so bumping compileSdk/buildToolsVersion
      # automatically invalidates the cache and installs the new versions.
      - name: Cache Android SDK components
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-sdk
          key: android-sdk-${{ hashFiles('app/build.gradle.kts') }}

      - name: Install Android SDK components
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Installs Gradle and handles caching — no gradlew wrapper needed in the repo.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Ensure the debug keystore exists so unsigned release builds can self-sign.
      - name: Create debug keystore if absent
        if: >
          github.ref != 'refs/heads/release' &&
          !(github.event_name == 'workflow_dispatch' && inputs.sign == true)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      # Runs for every trigger that isn't a signed build.
      - name: Build APK
        if: >
          github.ref != 'refs/heads/release' &&
          !(github.event_name == 'workflow_dispatch' && inputs.sign == true)
        run: gradle assemble$(echo "${BUILD_TYPE^}") --no-daemon
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}

      - name: Decode keystore
        if: github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && inputs.sign == true)
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks

      - name: Build APK (signed)
        if: github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && inputs.sign == true)
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Clean up keystore
        if: always() && (github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && inputs.sign == true))
        run: rm -f app/keystore.jks

      # PR and plain main-branch pushes: just upload an artifact, no release tag.
      - name: Upload APK artifact
        if: github.ref != 'refs/heads/release' && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: NiriLauncher-${{ github.event.inputs.build_type || 'release' }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ github.event.inputs.build_type || 'release' }}/*.apk
          retention-days: 30

      - name: Get version from build.gradle.kts
        if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        id: get_version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # workflow_dispatch without sign=true → unsigned release (no secrets needed).
      # release branch → always signed.
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ github.run_number }}
          name: Niri Launcher v${{ steps.get_version.outputs.version }}${{ (github.event_name == 'workflow_dispatch' && inputs.sign != true) && ' (unsigned)' || '' }}
          files: app/build/outputs/apk/release/*.apk
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.sign != true }}
          generate_release_notes: true
